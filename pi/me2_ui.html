<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOOTS · ME2</title>
<style>
/* ============ THEME TOKENS ============ */
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
:root{
  --bg:#0d1117;--bg-grad:linear-gradient(170deg,#0d1117 0%,#111827 50%,#0d1117 100%);
  --card:#161b22;--card2:#1c2230;--line:#21262d;--track:#21262d;
  --tx:#e6edf3;--dim:#8b949e;
  --blue:#58a6ff;--green:#3fb950;--amber:#d29922;--red:#f85149;
  --glow-blue:rgba(88,166,255,.28);--glow-green:rgba(63,185,80,.30);
  --shadow:0 1px 3px rgba(0,0,0,.5),0 4px 14px rgba(0,0,0,.3);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --accent-top:rgba(88,166,255,.08);
}
[data-theme="light"]{
  --bg:#f0f3f7;--bg-grad:linear-gradient(170deg,#f8fafc 0%,#e8edf5 40%,#f0f3f7 100%);
  --card:#ffffff;--card2:#f3f6fa;--line:#d8dee6;--track:#e8ecf1;
  --tx:#1a202c;--dim:#5a6577;
  --blue:#2563eb;--green:#16a34a;--amber:#d97706;--red:#dc2626;
  --glow-blue:rgba(37,99,235,.22);--glow-green:rgba(22,163,74,.24);
  --shadow:0 1px 3px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.08);
  --shadow-sm:0 1px 2px rgba(0,0,0,.05);
  --accent-top:rgba(37,99,235,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-grad);background-attachment:fixed;color:var(--tx);min-height:100vh;
  font:16px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  display:flex;justify-content:center;padding:28px 16px;
  transition:background .3s,color .3s}
main{width:100%;max-width:640px}

/* ============ HEADER ============ */
header{display:flex;align-items:center;gap:10px;margin-bottom:16px;
  padding:12px 16px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--shadow-sm)}
.lamp{width:12px;height:12px;border-radius:50%;background:var(--blue);
  box-shadow:0 0 10px var(--blue);transition:background .3s}
.lamp.awake{background:var(--green);box-shadow:0 0 10px var(--green)}
.lamp.clarify{background:var(--amber);box-shadow:0 0 10px var(--amber)}
.lamp.reject{background:var(--red);box-shadow:0 0 10px var(--red)}
.brand{font-size:15px;font-weight:700;letter-spacing:.06em}
.mode{font-size:11px;letter-spacing:.14em;color:var(--dim)}
.mode.awake{color:var(--green)}
.mode.clarify{color:var(--amber)}
.mode.reject{color:var(--red)}
.mode.slotfill,.mode.slotcheck{color:var(--amber)}
.hright{margin-left:auto;display:flex;align-items:center;gap:14px}
.hw{display:flex;align-items:center;gap:6px}
.wicon{font-size:18px;line-height:1}
.wtemp{font-size:14px;font-weight:650;font-variant-numeric:tabular-nums}
.wcond{font-size:11.5px;color:var(--dim)}
.hclock{font-size:14px;font-weight:650;font-variant-numeric:tabular-nums}
.toggle{width:30px;height:30px;border-radius:8px;cursor:pointer;
  border:1px solid var(--line);background:var(--card2);color:var(--tx);
  font-size:14px;display:flex;align-items:center;justify-content:center;
  transition:background .2s,border-color .2s}
.toggle:hover{border-color:var(--blue)}

/* ============ BIG CARD (LAST COMMAND) ============ */
.bigcard{position:relative;margin-bottom:16px;border-radius:15px}
.bigcard::before{content:"";position:absolute;inset:-3px;border-radius:17px;
  z-index:0;opacity:0;filter:blur(7px);
  background:conic-gradient(from var(--a),
    transparent 0deg,var(--green) 42deg,transparent 84deg,
    transparent 180deg,var(--blue) 222deg,transparent 264deg);
  transition:opacity .3s}
/* amber variant for clarify/slot-fill */
.bigcard.amber-glow::before{
  background:conic-gradient(from var(--a),
    transparent 0deg,var(--amber) 42deg,transparent 84deg,
    transparent 180deg,var(--blue) 222deg,transparent 264deg)}
.bigcard.listening{z-index:0}
.bigcard.listening::before{opacity:.95;animation:spin 2.4s linear infinite}
@keyframes spin{to{--a:360deg}}
.bigcard .inner{position:relative;z-index:1;background:var(--card);
  border:1px solid var(--line);border-radius:15px;padding:22px;
  box-shadow:var(--shadow);transition:background .3s,border-color .3s;
  border-top:2px solid var(--accent-top)}
.k{font-size:11px;letter-spacing:.18em;color:var(--dim);margin-bottom:8px}
.cmd{font-size:30px;font-weight:650}
.cmd-ic{margin-right:10px;font-size:26px;vertical-align:-2px;display:inline-block}
.cmd-ic[data-ico=timer]{animation:icoFlip 2s ease-in-out infinite}
.cmd-ic[data-ico=alarm]{animation:icoRing .6s ease-in-out infinite}
.cmd-ic[data-ico=music]{animation:icoBounce 1.2s ease-in-out infinite}
.cmd-ic[data-ico=lights]{animation:icoPulse 2s ease-in-out infinite}
.cmd-ic[data-ico=thermo]{animation:icoSpin 4s linear infinite}
.cmd-ic[data-ico=ask]{animation:icoWiggle 1.5s ease-in-out infinite}
.cmd-ic[data-ico=call]{animation:icoCall .5s ease-in-out infinite}
@keyframes icoFlip{0%,40%{transform:translateY(-2px) rotate(0)}50%,90%{transform:translateY(-2px) rotate(180deg)}100%{transform:translateY(-2px) rotate(360deg)}}
@keyframes icoRing{0%,100%{transform:translateY(-2px) rotate(0)}20%{transform:translateY(-2px) rotate(14deg)}40%{transform:translateY(-2px) rotate(-12deg)}60%{transform:translateY(-2px) rotate(8deg)}80%{transform:translateY(-2px) rotate(-6deg)}}
@keyframes icoBounce{0%,100%{transform:translateY(-2px)}50%{transform:translateY(-8px)}}
@keyframes icoPulse{0%,100%{transform:translateY(-2px) scale(1);opacity:1}50%{transform:translateY(-2px) scale(1.15);opacity:.8}}
@keyframes icoSpin{from{transform:translateY(-2px) rotate(0)}to{transform:translateY(-2px) rotate(360deg)}}
@keyframes icoWiggle{0%,100%{transform:translateY(-2px) rotate(0)}25%{transform:translateY(-2px) rotate(8deg)}75%{transform:translateY(-2px) rotate(-8deg)}}
@keyframes icoCall{0%,100%{transform:translateY(-2px) rotate(0)}15%{transform:translateY(-2px) rotate(-20deg)}30%{transform:translateY(-2px) rotate(18deg)}45%{transform:translateY(-2px) rotate(-14deg)}60%{transform:translateY(-2px) rotate(10deg)}75%{transform:translateY(-2px) rotate(-6deg)}}
.slot{font-size:20px;color:var(--blue);margin-top:2px}
.slot.q{font-size:23px;font-weight:560;line-height:1.35;margin-top:6px;
  padding:12px 14px;border-left:3px solid var(--blue);
  background:var(--card2);border-radius:0 10px 10px 0}
.slot.q .qtag{display:block;font-size:11px;letter-spacing:.14em;
  color:var(--dim);margin-bottom:4px}
.slot.dim{font-size:24px;font-weight:650;margin-top:4px;font-variant-numeric:tabular-nums}
.slot.dim .arr{color:var(--dim);margin:0 8px;font-weight:400}
.slot.dim .old{color:var(--dim);opacity:.7}
.slot.dim .new{color:var(--blue)}
.slot.none{color:var(--dim);font-size:15px}
.slot.lowconf{color:var(--amber)}
.bar{height:8px;background:var(--track);border-radius:4px;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:4px;transition:width .3s}
.meta{display:flex;gap:18px;margin-top:12px;font-size:12px;color:var(--dim)}
.empty{font-size:17px;color:var(--dim)}
.empty .hint{display:block;font-size:13px;margin-top:6px;opacity:.7}

/* ============ CLARIFY / REJECT / SLOT-FILL STATES ============ */
.clarify-msg{font-size:28px;color:var(--amber);font-weight:650;margin-bottom:12px}
.clarify-sub{font-size:18px;color:#fff;margin-bottom:14px}
.cand-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.cand{padding:8px 14px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;
  border:1px solid var(--line);background:var(--card2);color:var(--tx);
  transition:border-color .2s,background .2s,transform .1s}
.cand:hover{border-color:var(--blue);background:var(--glow-blue);transform:translateY(-1px)}
.cand .cand-conf{font-size:11px;color:var(--dim);font-weight:400;margin-left:6px}
.reject-msg{font-size:28px;font-weight:650;color:var(--red);margin-bottom:8px}
.reject-sub{font-size:18px;color:#fff;margin-bottom:8px}
.slotfill-msg{font-size:28px;color:var(--amber);font-weight:650;margin-bottom:8px}
.slotfill-prompt{font-size:18px;color:#fff;margin-bottom:8px}
.slotfill-hint{font-size:13px;color:var(--dim)}
.slotcheck-msg{font-size:28px;color:var(--amber);font-weight:650;margin-bottom:8px}
.slotcheck-prompt{font-size:18px;color:#fff;margin-bottom:14px}
.slotcheck-hint{font-size:13px;color:var(--dim);margin-top:10px}
.retry-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;
  color:var(--dim);background:var(--card2);padding:3px 8px;border-radius:6px;margin-top:10px}
.retry-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--amber)}

/* ============ DEVICES GRID ============ */
h2{font-size:12px;letter-spacing:.16em;color:var(--dim);margin:0 0 10px 2px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{position:relative;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:16px;box-shadow:var(--shadow-sm);
  transition:border-color .25s,box-shadow .25s}
.tile.active{border-color:var(--blue);box-shadow:0 0 0 2px var(--glow-blue),var(--shadow)}
.tk{font-size:10px;letter-spacing:.14em;color:var(--dim);margin-bottom:10px}
.big{font-size:22px;font-weight:650}
.big.mid{font-size:17px;line-height:1.3}
.big.dim{color:var(--dim)}
.sub{font-size:12px;color:var(--dim);margin-top:2px}
.lampdot{width:44px;height:44px;border-radius:50%;background:var(--track);
  margin-bottom:8px;transition:background .3s,box-shadow .3s}
.lampdot.on{
  background:radial-gradient(circle,#fff8e1 30%,#ffd54f 70%,#ffb300);
  box-shadow:0 0 var(--glow,18px) rgba(255,213,79,.7);
  animation:lampPulse 2s ease-in-out infinite}
@keyframes lampPulse{
  0%,100%{box-shadow:0 0 var(--glow,18px) rgba(255,213,79,.7)}
  50%{box-shadow:0 0 calc(var(--glow,18px) * 1.5) rgba(255,213,79,.9)}}
.lvl{height:6px;background:var(--track);border-radius:3px;overflow:hidden;margin-bottom:6px}
.lvl i{display:block;height:100%;background:var(--amber);border-radius:3px;transition:width .3s}
.lvltext{font-size:12px;color:var(--dim);font-weight:600}
.lvltext.on{color:var(--amber)}
/* thermostat */
.thermo-big{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
/* timer — static SVG arc */
.twrap{display:flex;align-items:center;gap:12px}
.tarc{width:56px;height:56px;flex-shrink:0}
.tarc svg{width:100%;height:100%;transform:rotate(-90deg)}
.tarc .bg{fill:none;stroke:var(--track);stroke-width:5}
.tarc .fg{fill:none;stroke:var(--blue);stroke-width:5;stroke-linecap:round;
  transition:stroke-dashoffset .5s ease}
.tval{font-size:18px;font-weight:650;font-variant-numeric:tabular-nums}
.tsub2{font-size:11px;color:var(--dim)}
/* music */
#mtrack{text-align:center}
#t-music .mbtns{justify-content:center}
.mbtns{display:flex;gap:6px;margin-top:10px}
.mbtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);
  background:var(--card2);color:var(--tx);font-size:13px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s}
.mbtn:hover{border-color:var(--blue);background:var(--glow-blue)}
.mbtn.play{background:var(--blue);color:#fff;border-color:var(--blue)}
/* music — progress bar + equalizer (2026-10-02) */
.mprog{height:6px;background:var(--track);border-radius:3px;overflow:hidden;margin-top:12px}
.mprog i{display:block;height:100%;width:0;background:var(--blue);border-radius:3px;
  transition:width .5s linear}
.mtime{font-size:11px;color:var(--dim);text-align:center;margin-top:5px;
  font-variant-numeric:tabular-nums;min-height:14px}
/* V4 volume — HEADER fader (design D, 2026-10-03): compact level fader in the
   tile header, body stays clean. Draggable, fires VOLUME_UP/DOWN (±20). The
   track fill is a gradient driven by --fill (set from JS = volume %). */
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.mhead .tk{margin-bottom:0}
.volhead{display:flex;align-items:center;gap:7px}
.volhead .spk{font-size:14px;line-height:1;opacity:.9}
.volhead input[type=range]{
  -webkit-appearance:none;appearance:none;width:64px;height:6px;border-radius:3px;
  background:linear-gradient(to right,var(--blue) 0%,var(--blue) var(--fill,60%),
    var(--track) var(--fill,60%),var(--track) 100%);
  outline:none;cursor:pointer;margin:0}
.volhead input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:13px;height:13px;border-radius:50%;
  background:var(--blue);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.5);cursor:pointer}
.volhead input[type=range]::-moz-range-thumb{
  width:13px;height:13px;border-radius:50%;background:var(--blue);border:2px solid #fff;cursor:pointer}
.volhead .vval{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;min-width:18px;text-align:right}
.meq{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:18px;margin-top:10px}
.meq i{width:3px;height:100%;background:var(--blue);border-radius:2px;
  transform-origin:bottom;transform:scaleY(.22);opacity:.45;
  transition:transform .3s,opacity .3s}
#t-music.playing .meq i{opacity:1;animation:eqB .9s ease-in-out infinite}
#t-music.playing .meq i:nth-child(1){animation-duration:.85s;animation-delay:-.20s}
#t-music.playing .meq i:nth-child(2){animation-duration:1.15s;animation-delay:-.55s}
#t-music.playing .meq i:nth-child(3){animation-duration:.70s;animation-delay:-.10s}
#t-music.playing .meq i:nth-child(4){animation-duration:1.25s;animation-delay:-.45s}
#t-music.playing .meq i:nth-child(5){animation-duration:.95s;animation-delay:-.30s}
@keyframes eqB{0%,100%{transform:scaleY(.22)}50%{transform:scaleY(1)}}
/* chips (alarms, notes) */
.chiprow{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:4px 10px;border-radius:8px;background:var(--card2);
  border:1px solid var(--line);font-weight:600}
.chip.faded{color:var(--dim);opacity:.5}
/* reminders — checklist (design C, 2026-10-03): tappable rows + open-count
   badge. Open rows first, done rows struck-through + muted below. */
.remhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.remhead .tk{margin-bottom:0}
.remcount{font-size:10.5px;font-weight:650;color:var(--blue);background:var(--glow-blue);
  border:1px solid var(--line);padding:2px 8px;border-radius:20px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.remcount.zero{color:var(--dim);background:var(--card2)}
.rem{display:flex;flex-direction:column;gap:6px}
.remrow{display:flex;align-items:flex-start;gap:9px;padding:7px 9px;border-radius:9px;
  background:var(--card2);border:1px solid var(--line);cursor:pointer;
  transition:border-color .2s,background .2s,opacity .2s}
.remrow:hover{border-color:var(--blue)}
.rembox{width:17px;height:17px;border-radius:5px;flex-shrink:0;margin-top:1px;
  border:1.5px solid var(--dim);background:var(--card);position:relative;
  transition:background .2s,border-color .2s}
.remrow.done .rembox{background:var(--green);border-color:var(--green)}
.remrow.done .rembox::after{content:"";position:absolute;left:5px;top:2px;width:4px;height:8px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.remtxt{font-size:13px;font-weight:600;line-height:1.35;word-break:break-word}
.remrow.done .remtxt{color:var(--dim);text-decoration:line-through;text-decoration-color:var(--dim)}
.remrow.done{opacity:.6}
.remempty{font-size:12.5px;color:var(--dim);opacity:.6;padding:4px 2px}

/* ============ MOCK CONTROL STRIP ============ */
.mockbar{margin-top:20px;padding:14px 16px;background:var(--card);
  border:1px dashed var(--line);border-radius:12px}
.mockbar .mk{font-size:10px;letter-spacing:.14em;color:var(--dim);margin-bottom:8px}
.mockbtns{display:flex;flex-wrap:wrap;gap:6px}
.mockbtn{padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;
  border:1px solid var(--line);background:var(--card2);color:var(--tx);cursor:pointer;
  transition:border-color .2s,background .2s}
.mockbtn:hover{border-color:var(--blue);background:var(--glow-blue)}
.mockbtn.active{border-color:var(--blue);background:var(--glow-blue);color:var(--blue)}
</style>
</head>
<body>
<main>
<header>
  <div class="lamp" id="lamp"></div>
  <span class="brand">BOOTS</span>
  <span class="mode" id="mode">IDLE</span>
  <div class="hright">
    <div class="hw">
      <span class="wicon" id="wicon">⛅</span>
      <span class="wtemp" id="wtemp">23°</span>
      <span class="wcond" id="wcond">Partly cloudy</span>
    </div>
    <span class="hclock" id="wtime-clock">--:--</span>
    <button class="toggle" id="theme" title="toggle theme">◐</button>
  </div>
</header>

<div class="bigcard" id="bigcard">
  <div class="inner">
    <div class="k">LAST COMMAND</div>
    <div id="last"><div class="empty">waiting — say "Hey boots", then speak
      your command</div></div>
  </div>
</div>

<h2>DEVICES</h2>
<div class="tiles">
  <div class="tile" id="t-lamp"><div class="tk">LIGHTS</div>
    <div class="lampdot" id="lampdot"></div>
    <div class="lvl"><i id="lvlbar" style="width:0%"></i></div>
    <div class="lvltext" id="lvltext">OFF</div></div>
  <div class="tile" id="t-thermo"><div class="tk">THERMOSTAT</div>
    <div class="thermo-big" id="tcur">21.5°</div>
    <div class="sub" id="tmode">set point</div></div>
  <div class="tile" id="t-timer"><div class="tk">TIMER</div>
    <div class="twrap">
      <div class="tarc"><svg viewBox="0 0 56 56">
        <circle class="bg" cx="28" cy="28" r="23"/>
        <circle class="fg" id="tarc-fg" cx="28" cy="28" r="23"
          stroke-dasharray="144.5" stroke-dashoffset="0"/>
      </svg></div>
      <div><div class="tval" id="ttext">—</div><div class="tsub2" id="tsub"></div></div>
    </div></div>
  <div class="tile" id="t-alarm"><div class="tk">ALARMS</div>
    <div class="chiprow" id="alarms"><span class="chip faded">none</span></div></div>
  <div class="tile" id="t-music">
    <div class="mhead"><div class="tk">MUSIC</div>
      <div class="volhead">
        <span class="spk">🔊</span>
        <input type="range" id="volrng" min="0" max="100" step="1" value="60" aria-label="volume">
        <span class="vval" id="volval">60</span>
      </div>
    </div>
    <div class="big mid dim" id="mtrack">nothing playing</div>
    <div class="meq"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="mprog"><i id="mprog-fill"></i></div>
    <div class="mtime" id="mtime"></div>
    <div class="mbtns">
      <button class="mbtn" id="mprev" title="previous">⏮</button>
      <button class="mbtn" id="mpb" title="play/pause">▶</button>
      <button class="mbtn" id="mnext" title="next">⏭</button>
    </div></div>
  <div class="tile" id="t-notes">
    <div class="remhead"><div class="tk">REMINDERS</div>
      <span class="remcount" id="remcount">0 open</span></div>
    <div class="rem" id="rem"><span class="remempty">no reminders — say "remind me to …"</span></div></div>
</div>

</main>

<script>
// ---- helpers ----
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fmtT=sec=>{sec=Math.max(0,Math.floor(sec||0));
  const m=Math.floor(sec/60),s2=sec%60;
  return m+':'+String(s2).padStart(2,'0');};
function setTimerArc(frac){
  const C=144.5;
  $('tarc-fg').style.strokeDashoffset=C*(1-frac);
}

// ---- tile map: command → tile id ----
const TILES={
  PLAY_MUSIC:'t-music',VOLUME_UP:'t-music',VOLUME_DOWN:'t-music',
  NEXT:'t-music',PAUSE:'t-music',STOP:'t-music',
  LIGHT_ON:'t-lamp',LIGHT_OFF:'t-lamp',BRIGHTNESS:'t-lamp',COLOR:'t-lamp',
  TEMPERATURE:'t-thermo',WEATHER:'t-thermo',TIME:'t-thermo',
  TIMER:'t-timer',ALARM:'t-alarm',
  CALL:'t-notes',MESSAGE:'t-notes',
  CREATE_REMINDER:'t-notes',LIST_REMINDERS:'t-notes',
  OUT_OF_SCOPE:null
};
// V3 command -> [icon, anim-key] (big-card done state)
const ICONS={
  PLAY_MUSIC:['🎵','music'],VOLUME_UP:['🔊','music'],VOLUME_DOWN:['🔉','music'],
  NEXT:['⏭','music'],PAUSE:['⏸','music'],STOP:['⏹','music'],
  LIGHT_ON:['💡','lights'],LIGHT_OFF:['🌙','lights'],
  BRIGHTNESS:['🔆','lights'],COLOR:['🎨','lights'],
  TEMPERATURE:['🌡️','thermo'],WEATHER:['⛅','thermo'],TIME:['🕐','thermo'],
  TIMER:['⏳','timer'],ALARM:['⏰','alarm'],
  CALL:['📞','call'],MESSAGE:['✉️','call'],
  CREATE_REMINDER:['📝','call'],LIST_REMINDERS:['📋','call'],
  OUT_OF_SCOPE:['🚫','']
};

// ---- clock ----
function tick(){
  const d=new Date();
  $('wtime-clock').textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}
tick();setInterval(tick,1000);

// ---- theme ----
const saved=localStorage.getItem('me2-theme');
if(saved)document.documentElement.dataset.theme=saved;
$('theme').onclick=()=>{
  const t=document.documentElement.dataset.theme==='light'?'dark':'light';
  document.documentElement.dataset.theme=t;
  localStorage.setItem('me2-theme',t);
};

// ---- live fire: POST a command to the Pi (voice is primary; the UI is a
//     secondary control surface — the slider + transport buttons drive the
//     same /fire dispatch as a spoken command). ----
let LIVE=false;
async function fire(cmd,slot){
  if(!LIVE) return;
  try{
    await fetch('/fire',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({cmd,slot:slot!=null?slot:null,conf:1.0})});
  }catch(e){}
}
// header volume fader -> SET_VOLUME (exact value; the 1 Hz sync loop
// keeps the tile + slider in lockstep with the M1A HW knob). step=1 so
// the thumb can land on any HW value, not just multiples of 20.
(function(){
  const rng=$('volrng'); if(!rng) return;
  rng.addEventListener('change',()=>fire('SET_VOLUME', rng.value));
})();
// transport buttons -> the same /fire the voice uses
(function(){
  const pb=$('mpb'), pv=$('mprev'), nx=$('mnext');
  if(pb) pb.onclick=()=>{
    // resume the paused track if one is loaded, else start a fresh one
    fire(pb.textContent==='⏸' ? 'PAUSE' : (pb.dataset.trk ? 'RESUME' : 'PLAY_MUSIC'));
  };
  if(pv) pv.onclick=()=>fire('STOP');
  if(nx) nx.onclick=()=>fire('NEXT');
})();

// ---- reminders: render the checklist + wire checkbox toggles ----
function renderReminders(list){
  const box=$('rem'); if(!box) return;
  const open=list.filter(r=>!r.done);
  const done=list.filter(r=>r.done);
  const cnt=$('remcount');
  if(cnt){
    cnt.textContent=open.length+' open'+(done.length?' · '+done.length+' done':'');
    cnt.classList.toggle('zero',open.length===0);
  }
  if(!list.length){
    box.innerHTML='<span class="remempty">no reminders — say "remind me to …"</span>';
    return;
  }
  const row=(r,i)=>
    `<div class="remrow${r.done?' done':''}" data-i="${i}">
       <span class="rembox"></span>
       <span class="remtxt">${esc(r.text)}</span>
     </div>`;
  box.innerHTML=open.map(row).join('')+done.map(row).join('');
  box.querySelectorAll('.remrow').forEach(el=>{
    el.onclick=async()=>{
      const i=+el.dataset.i;
      const r=list[i]; if(!r) return;
      r.done=!r.done;
      renderReminders(list);
      if(LIVE){
        try{
          await fetch('/reminders',{method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({index:i,done:r.done})});
        }catch(e){}
      }
    };
  });
}

// ---- render ----
function render(s){
  const bc=$('bigcard');
  const last=s.last;
  const mode=s.mode;

  // header lamp + mode
  const lamp=$('lamp');
  lamp.className='lamp';
  const modeEl=$('mode');
  modeEl.className='mode';

  if(mode==='awake'){lamp.classList.add('awake');modeEl.textContent='SPEAK NOW';modeEl.classList.add('awake')}
  else if(mode==='clarify'){lamp.classList.add('clarify');modeEl.textContent='CLARIFY';modeEl.classList.add('clarify')}
  else if(mode==='reject'){lamp.classList.add('reject');modeEl.textContent='RETRY';modeEl.classList.add('reject')}
  else if(mode==='slotfill'){lamp.classList.add('clarify');modeEl.textContent='NEED DETAIL';modeEl.classList.add('slotfill')}
  else if(mode==='slotcheck'){lamp.classList.add('clarify');modeEl.textContent='SLOT CHECK';modeEl.classList.add('slotcheck')}
  else if(mode==='done'){modeEl.textContent='DONE'}
  else{modeEl.textContent='IDLE'}

  // big card: edge glow for listening states (awake, clarify, reject, slotfill)
  bc.classList.toggle('listening',mode==='awake'||mode==='clarify'||mode==='reject'||mode==='slotfill'||mode==='slotcheck');
  bc.classList.toggle('amber-glow',mode==='clarify'||mode==='slotfill'||mode==='reject'||mode==='slotcheck');

  // big card content
  const lastEl=$('last');
  if(mode==='idle'){
    lastEl.innerHTML='<div class="empty">waiting — say "Hey boots", then speak\n      your command</div>';
  }else if(mode==='awake'){
    lastEl.innerHTML='<div class="cmd" style="color:var(--green)">Listening…</div><div class="slot none">speak now</div>';
  }else if(mode==='clarify'){
    // candidates as tappable chips
    const cands=s.candidates||[];
    let chips=cands.map(c=>
      `<div class="cand" data-cmd="${c.cmd}">${esc(c.label)}<span class="cand-conf">${Math.round(c.conf*100)}%</span></div>`
    ).join('');
    const retryBadge=s.retries?`<div class="retry-badge"><span class="dot"></span>attempt ${s.retries}/2</div>`:'';
    lastEl.innerHTML=`<div class="clarify-msg">Didn't quite catch that</div>
      <div class="clarify-sub">Did you mean one of these?</div>
      <div class="cand-row">${chips}</div>
      ${retryBadge}`;
    // MOCKUP-ONLY: prod chip tap POSTs the choice to the Pi
    lastEl.querySelectorAll('.cand').forEach(el=>{
      el.onclick=()=>{
        const cmd=el.dataset.cmd;
        const d=DEMO.find(x=>x.state.last&&x.state.last.cmd===cmd);
        if(d)showState(d);
      };
    });
  }else if(mode==='reject'){
    const retryBadge=s.retries?`<div class="retry-badge"><span class="dot"></span>attempt ${s.retries}/2</div>`:'';
    lastEl.innerHTML=`<div class="reject-msg">Didn't catch that</div>
      <div class="reject-sub">Please speak again.</div>
      ${retryBadge}`;
  }else if(mode==='slotfill'){
    const cmdLabel=last?cap(last.cmd.replace(/_/g,' ')):'';
    lastEl.innerHTML=`<div class="slotfill-msg">Got it — ${esc(cmdLabel)}</div>
      <div class="slotfill-prompt">${esc(s.slotPrompt||'…')}</div>`;
  }else if(mode==='slotcheck'&&last){
    const cmdLabel=cap(last.cmd.replace(/_/g,' '));
    const slotVal=esc(last.slot||'');
    const slotAlt=esc(last.slotAlt||'');
    const confPct=Math.round((last.slotConf||0)*100);
    const altPct=Math.round((last.slotAltConf||0)*100);
    lastEl.innerHTML=`<div class="slotcheck-msg">${esc(cmdLabel)} for ${slotVal}</div>
      <div class="slotcheck-prompt">${esc(s.slotPrompt||'did you mean')}</div>
      <div class="cand-row">
        <div class="cand" data-choice="heard">${slotVal}<span class="cand-conf">${confPct}%</span></div>
        <div class="cand" data-choice="alt">${slotAlt}<span class="cand-conf">${altPct}%</span></div>
      </div>
      <div class="slotcheck-hint">or say it again</div>`;
    // MOCKUP-ONLY: prod chip tap POSTs the choice to the Pi
    lastEl.querySelectorAll('.cand').forEach(el=>{
      el.onclick=()=>{
        const choice=el.dataset.choice;
        if(choice==='alt'){
          const tmp=last.slot;
          last.slot=last.slotAlt;
          last.slotAlt=tmp;
        }
        s.mode='done';
        render(s);
      };
    });
  }else if(mode==='done'&&last){
    const c=last.cmd;
    const [icon,icoKey]=(typeof ICONS!=='undefined'&&ICONS[c])?ICONS[c]:['⚙',''];
    const verb=cap(c.replace(/_/g,' '));
    let slotHtml='';
    if(last.slot){
      const lowConf=last.slotMargin!==undefined&&last.slotMargin<0.15;
      slotHtml=`<div class="slot${lowConf?' lowconf':''}">${esc(last.slot)}</div>`;
    }else{
      slotHtml='<div class="slot none">—</div>';
    }
    const conf=last.conf!==undefined?last.conf:0.97;
    const lat=last.latency!==undefined?last.latency:128;
    lastEl.innerHTML=`<div class="cmd"><span class="cmd-ic"${icoKey?` data-ico="${icoKey}"`:''}>${icon}</span>${esc(verb)}</div>${slotHtml}
      <div class="meta"><span>conf ${conf.toFixed(2)}</span><span>${lat} ms</span></div>`;
  }else{
    lastEl.innerHTML='<div class="empty">—</div>';
  }

  // tiles: only the matching one glows
  document.querySelectorAll('.tile').forEach(t=>t.classList.remove('active'));
  if(s.last&&TILES[s.last.cmd])
    document.getElementById(TILES[s.last.cmd]).classList.add('active');

  // lights
  const lamp2=s.lamp||{on:false,level:0,color:'white'};
  const ld=$('lampdot');
  ld.classList.toggle('on',lamp2.on);
  ld.style.setProperty('--glow',lamp2.on?Math.round(8+lamp2.level*0.32)+'px':'0px');
  // lamp color -> shared hex (dot + brightness slider both follow the lamp)
  const CHX={white:'#ffd54f',red:'#ff6b6b',blue:'#4dabf7',green:'#51cf66'};
  const chx=CHX[lamp2.color]||CHX.white;
  if(lamp2.on){
    ld.style.background='radial-gradient(circle,#fff8e1 30%,'+chx+' 70%,'+chx+')';
  }else{ld.style.background='';}
  const lbar=$('lvlbar');
  lbar.style.width=lamp2.on?lamp2.level+'%':'0%';
  lbar.style.background=lamp2.on?chx:'';  // slider fill follows the lamp color
  const lt=$('lvltext');
  lt.textContent=lamp2.on?('ON · '+lamp2.level+'%'
    +((lamp2.color&&lamp2.color!=='white')?' · '+lamp2.color:'')):'OFF';
  lt.classList.toggle('on',lamp2.on);
  lt.style.color=lamp2.on?chx:'';  // label tinted to the lamp color too

  // thermostat
  $('tcur').textContent=(s.thermo??21.5)+'°';

  // timer — real device state in live mode (s.timer present);
  // ?d= previews keep the mockup's static behaviour
  if('timer' in s){
    const T=s.timer;
    if(T&&!T.done){
      const r=Math.max(0,T.remaining|0);
      $('ttext').textContent=Math.floor(r/60)+':'+String(r%60).padStart(2,'0');
      $('tsub').textContent='counting down';
      setTimerArc(T.frac_left||0);
    }else if(T){
      $('ttext').textContent='done';$('tsub').textContent='';setTimerArc(0);
    }else{
      $('ttext').textContent='—';$('tsub').textContent='';setTimerArc(0);
    }
  }else{
    const timerActive=s.last&&s.last.cmd==='TIMER'&&s.mode==='done';
    if(timerActive){
      $('ttext').textContent=s.last.slot||'5:00';
      $('tsub').textContent='counting down';
      setTimerArc(1);
    }else{
      $('ttext').textContent='04:32';
      $('tsub').textContent='';
      setTimerArc(0.75);
    }
  }

  // alarms — real list in live mode
  if('alarms' in s){
    const A=s.alarms||[];
    $('alarms').innerHTML=A.length
      ?A.map(a=>'<span class="chip">'+esc(a)+'</span>').join('')
      :'<span class="chip faded">none</span>';
  }else{
    const alarmActive=s.last&&s.last.cmd==='ALARM'&&s.mode==='done';
    $('alarms').innerHTML=`<span class="chip${alarmActive?'':' faded'}">${alarmActive?esc(s.last.slot):'7:00 AM'}</span>`;
  }

  // music — track + equalizer + progress bar + elapsed/duration
  const music=s.music||{track:'nothing playing',playing:false,vol:60};
  const mt=$('mtrack');
  mt.textContent=music.track;
  mt.classList.toggle('dim',!music.playing);
  const pb=$('mpb');
  pb.textContent=music.playing?'⏸':'▶';
  pb.classList.toggle('play',music.playing);
  // paused track loaded -> the ▶ resumes THIS track (RESUME); else fresh
  pb.dataset.trk=(music.paused&&music.track&&music.track!=='nothing playing')?'1':'';
  $('t-music').classList.toggle('playing',!!music.playing);
  const frac=Math.max(0,Math.min(1,(music.fraction!=null?music.fraction:0)));
  $('mprog-fill').style.width=(frac*100).toFixed(1)+'%';
  $('mtime').textContent=(music.duration!=null)
    ?fmtT(music.elapsed||0)+' / '+fmtT(music.duration)
    :'';
  if($('volval')){
    const v=music.vol!=null?music.vol:0;
    $('volval').textContent=v;
    const rng=$('volrng');
    if(rng){
      if(rng.value!=String(v)) rng.value=v;
      rng.style.setProperty('--fill',v+'%');
    }
  }

  // reminders — structured checklist (live: real list; demo: synthesized)
  if('reminders' in s){
    renderReminders(s.reminders||[]);
  }else{
    const notesActive=s.last&&(s.last.cmd==='CREATE_REMINDER'||s.last.cmd==='CALL'||s.last.cmd==='LIST_REMINDERS')&&s.mode==='done';
    if(notesActive&&s.last.slot){
      renderReminders([{text:s.last.slot,done:false,ts:0}]);
    }else{
      renderReminders([]);
    }
  }

  // thermostat sub + weather — live mode (server fetch, fail-soft)
  if(s.tmode)$('tmode').textContent=s.tmode;
  if('weather' in s){
    if(s.weather){
      $('wicon').textContent=s.weather.icon||'—';
      $('wtemp').textContent=Math.round(s.weather.temp)+'°';
      $('wcond').textContent=s.weather.condition||'';
    }else{
      $('wicon').textContent='—';$('wtemp').textContent='—';$('wcond').textContent='';
    }
  }
}

// ?d=<idx> still previews DEMO states (handover §13); live mode is below
function showState(d,idx){
  document.querySelectorAll('.mockbtn').forEach((b,i)=>b.classList.toggle('active',i===idx));
  render(d.state);
}

// ---- URL params for quick preview: ?d=<idx> &theme=light|dark ----
const params=new URLSearchParams(location.search);
if(params.get('theme')){
  document.documentElement.dataset.theme=params.get('theme');
  localStorage.setItem('me2-theme',params.get('theme'));
}
const di=parseInt(params.get('d'));
if(!isNaN(di)&&DEMO[di])showState(DEMO[di],di);
else if(location.protocol!=='file:'){
  // LIVE mode — poll the Pi UI server (handover §7 data model, 1 Hz); the
  // slider + transport buttons POST /fire (LIVE=true enables them).
  LIVE=true;
  async function live(){
    try{render(await (await fetch('/ui_state')).json());}catch(e){}
  }
  live();setInterval(live,1000);
}else showState(DEMO[0],0);
</script>
